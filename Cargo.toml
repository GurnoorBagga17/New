[workspace]
resolver = "2"
members = [
    "identity",
    "observability/audit",
    "observability/kill-switch",
    "observability/opentelemetry",
    "services/extmcp/authorization",
    "services/extmcp/cedar",
    "services/extmcp/policy-api",
    "services/extmcp/runtime",
    "validators",
    "connectors",
    "attribution",
    "lineage-graph",
    "risk-engine",
    "alerts",
    "secretless",
    "approvals",
    "siem-soar",
    "fleet-control",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Axiom NHI Engineering <engineering@axiomnhi.io>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
crossbeam-channel = "0.5"
arc-swap = "1"
regex = "1"
getrandom = "0.2"
sha2 = "0.10"
hmac = "0.12"
ring = "0.17"
hex = "0.4"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
aws-config = "1.5"
aws-sdk-iam = "1.50"
aws-sdk-sts = "1.50"
kube = { version = "0.96", features = ["runtime", "client", "derive"] }
k8s-openapi = { version = "0.23", features = ["latest"] }
octocrab = "0.41"
petgraph = "0.6"
cron = "0.12"
