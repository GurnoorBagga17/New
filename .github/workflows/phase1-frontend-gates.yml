name: Phase 1 frontend and contract gates

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  team0-contracts-and-tokens:
    name: Team 0 contracts and tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install "jsonschema>=4.23,<5" "PyYAML>=6,<7"
      - run: python docs/architecture/scripts/check_design_tokens.py
      - run: python docs/architecture/scripts/validate_api_contract_fixtures.py
      - run: npm ci --prefix docs/architecture/token-build
      - run: npm --prefix docs/architecture/token-build run build

  rust-static-analysis:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  frontend-exit-gates:
    name: Frontend workspace, bundle, and air-gap gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm --filter @axiom/ui run build-storybook
      - run: pnpm --filter @axiom/cedar-editor run build-storybook
      - run: python docs/architecture/scripts/check_frontend_workspace.py
      - run: python docs/architecture/scripts/check_frontend_budgets.py
      - run: python docs/architecture/scripts/check_gateway_ui_offline.py
      - run: python docs/architecture/scripts/check_frontend_colors.py
