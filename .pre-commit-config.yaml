repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: "Axiom Zero-Secret Pre-Commit Guard (Gitleaks)"
  - repo: local
    hooks:
      - id: axiom-secret-and-sast-guard
        name: "Axiom SAST & Secret Pattern Verification"
        entry: python3 scripts/scan_secrets_and_sast.py
        language: system
        pass_filenames: false
      - id: axiom-frontend-token-color-gate
        name: "Axiom WCAG & Design-Token Color Gate"
        entry: python3 docs/architecture/scripts/check_frontend_colors.py
        language: system
        pass_filenames: false
