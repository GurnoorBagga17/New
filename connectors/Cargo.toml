[package]
name = "axiom-connectors"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
tokio.workspace = true
reqwest = { version = "0.12", features = ["json"] }
chrono.workspace = true

[features]
default = []
aws = ["dep:aws-sdk-iam", "dep:aws-config"]
k8s = ["dep:kube", "dep:k8s-openapi"]
github = ["dep:octocrab"]
full = ["aws", "k8s", "github"]

[dependencies.aws-sdk-iam]
workspace = true
optional = true

[dependencies.aws-config]
workspace = true
optional = true

[dependencies.kube]
workspace = true
optional = true

[dependencies.k8s-openapi]
workspace = true
optional = true

[dependencies.octocrab]
workspace = true
optional = true
