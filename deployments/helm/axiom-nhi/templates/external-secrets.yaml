apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.security.secretManagement.externalSecretName }}
  labels:
    app.kubernetes.io/name: axiom-nhi
    app.kubernetes.io/component: security-secrets
spec:
  refreshInterval: {{ .Values.security.secretManagement.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.security.secretManagement.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.security.secretManagement.externalSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: axiom-nhi/production/postgres-lineage
        property: connection_uri
    - secretKey: SPICEDB_PRESHARED_KEY
      remoteRef:
        key: axiom-nhi/production/spicedb
        property: preshared_key
    - secretKey: ED25519_AIBOM_SIGNING_KEY
      remoteRef:
        key: axiom-nhi/production/aibom-signing
        property: private_key_pem
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: axiom-nhi-airgap-sealed-bootstrap
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "false"
spec:
  encryptedData:
    OPENBAO_BOOTSTRAP_UNSEAL_TOKEN: AgBy8f92b7c1a4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0==
  template:
    metadata:
      name: axiom-nhi-airgap-sealed-bootstrap
    type: Opaque
