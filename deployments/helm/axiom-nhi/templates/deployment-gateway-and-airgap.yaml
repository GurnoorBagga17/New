apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-axiom-gateway
  labels:
    app.kubernetes.io/name: axiom-nhi
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: axiom-nhi
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: axiom-nhi
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: agentgateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          ports:
            - containerPort: 8080
          env:
            - name: AXIOM_RUNTIME_MODE
              value: {{ .Values.gateway.runtimeMode | quote }}
            - name: AXIOM_CALLOUT_TIMEOUT_MS
              value: {{ .Values.gateway.calloutTimeoutMs | quote }}
---
{{- if .Values.networkPolicy.enforceAirGapEgressBlock }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-airgap-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: axiom-nhi
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
