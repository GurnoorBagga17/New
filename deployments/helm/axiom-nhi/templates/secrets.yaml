{{- if not .Values.security.secretManagement.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "axiom-nhi.fullname" . }}-credentials
  labels:
    {{- include "axiom-nhi.labels" . | nindent 4 }}
type: Opaque
data:
  admin-token: {{ .Values.secrets.adminToken | default (randAlphaNum 48) | b64enc | quote }}
  postgres-password: {{ .Values.secrets.postgresPassword | default (randAlphaNum 32) | b64enc | quote }}
  session-secret: {{ .Values.secrets.sessionSecret | default (randAlphaNum 48) | b64enc | quote }}
  database-url: {{ printf "postgresql://%s:%s@%s-postgres-lineage:5432/%s" (.Values.postgresLineage.user | default "axiom") (.Values.secrets.postgresPassword | default "axiom_password") (include "axiom-nhi.fullname" .) (.Values.postgresLineage.database | default "axiom_lineage") | b64enc | quote }}
{{- end }}
