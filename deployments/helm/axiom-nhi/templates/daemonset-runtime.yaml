apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "axiom-nhi.fullname" . }}-extmcp-runtime
  labels:
    app.kubernetes.io/name: {{ include "axiom-nhi.name" . }}
    app.kubernetes.io/component: extmcp-inline-runtime
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "axiom-nhi.name" . }}
      app.kubernetes.io/component: extmcp-inline-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "axiom-nhi.name" . }}
        app.kubernetes.io/component: extmcp-inline-runtime
    spec:
      containers:
        - name: extmcp-runtime
          image: "{{ .Values.runtime.image.repository | default "ghcr.io/axiomnhi/extmcp-runtime" }}:{{ .Values.runtime.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.runtime.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: AXIOM_ENV
              value: "production"
            - name: AXIOM_EXTMCP_ADDR
              value: "0.0.0.0:9001"
            - name: AXIOM_ADMIN_ADDR
              value: "0.0.0.0:8787"
            - name: AXIOM_RUNTIME_MODE
              value: "enforce"
            - name: AXIOM_IDENTITY_CONFIG
              value: "/etc/axiom/identity.json"
            - name: AXIOM_RESOURCE_MAP_CONFIG
              value: "/etc/axiom/resources.json"
            - name: AXIOM_VALIDATION_CONFIG
              value: "/etc/axiom/tool-validation.json"
            - name: AXIOM_REVOCATION_CONFIG
              value: "/etc/axiom/revocations.json"
            - name: AXIOM_POLICY_BUNDLE_PATH
              value: "/etc/axiom/policies.json"
            - name: AXIOM_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "axiom-nhi.fullname" . }}-credentials
                  key: admin-token
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "axiom-nhi.fullname" . }}-credentials
                  key: database-url
            - name: OPENBAO_ADDR
              value: "http://{{ include "axiom-nhi.fullname" . }}-openbao:8200"
          ports:
            - name: grpc-extmcp
              containerPort: 9001
              protocol: TCP
            - name: http-admin
              containerPort: 8787
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8787
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8787
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 1
          volumeMounts:
            - name: config-volume
              mountPath: /etc/axiom
              readOnly: true
            {{- if .Values.spiffe.enabled }}
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            {{- end }}
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: "250m"
              memory: 512Mi
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "axiom-nhi.fullname" . }}-runtime-config
        {{- if .Values.spiffe.enabled }}
        - name: spiffe-workload-api
          csi:
            driver: "csi.spiffe.io"
            readOnly: true
        {{- end }}
