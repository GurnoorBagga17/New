name: axiom-nhi-g1

# Local G1 integration harness. This is not the enterprise production
# deployment: the MCP backend is a side-effect-free test fixture, while
# identity, validator, resource-map, and revocation config must be supplied.
services:
  axiom-gateway:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.agentgateway
    ports:
      - "8080:8080"
    environment:
      RUST_LOG: info
      AXIOM_RUNTIME_MODE: ${AXIOM_RUNTIME_MODE:-enforce}
    depends_on:
      extmcp-service:
        condition: service_started
      mcp-backend:
        condition: service_started

  extmcp-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.extmcp
    environment:
      AXIOM_EXTMCP_ADDR: 0.0.0.0:9001
      AXIOM_RUNTIME_MODE: ${AXIOM_RUNTIME_MODE:-enforce}
      AXIOM_IDENTITY_CONFIG: /etc/axiom/identity.json
      AXIOM_VALIDATION_CONFIG: /etc/axiom/validation-profiles.json
      AXIOM_RESOURCE_MAP_CONFIG: /etc/axiom/resources.json
      AXIOM_REVOCATION_CONFIG: /etc/axiom/revocations.json
    volumes:
      - ./config:/etc/axiom:ro
    expose:
      - "9001"
    restart: unless-stopped

  mcp-backend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../..:/app:ro
    command: ["node", "gateway/mcp-interceptor/mock_mcp_http_server.cjs"]
    expose:
      - "8000"
    restart: unless-stopped
