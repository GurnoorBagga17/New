name: axiom-nhi-g1

# Local G1 integration harness. This is not the enterprise production
# deployment: the MCP backend is a side-effect-free test fixture, while
# identity, validator, resource-map, and revocation config must be supplied.
services:
  axiom-gateway:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.agentgateway
    ports:
      - "8080:8080"
    environment:
      RUST_LOG: info
      AXIOM_RUNTIME_MODE: ${AXIOM_RUNTIME_MODE:-enforce}
    depends_on:
      extmcp-service:
        condition: service_started
      mcp-backend:
        condition: service_started

  extmcp-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.extmcp
    environment:
      AXIOM_EXTMCP_ADDR: 0.0.0.0:9001
      AXIOM_RUNTIME_MODE: ${AXIOM_RUNTIME_MODE:-enforce}
      AXIOM_IDENTITY_CONFIG: /etc/axiom/identity.json
      AXIOM_VALIDATION_CONFIG: /etc/axiom/validation-profiles.json
      AXIOM_RESOURCE_MAP_CONFIG: /etc/axiom/resources.json
      AXIOM_REVOCATION_CONFIG: /etc/axiom/revocations.json
      AXIOM_ADMIN_ADDR: 0.0.0.0:8787
      AXIOM_ADMIN_TOKEN: ${AXIOM_ADMIN_TOKEN:-axm_local_dev_token_for_browser_testing_32b}
      AXIOM_ADMIN_ACTOR: ${AXIOM_ADMIN_ACTOR:-local-operator}
      AXIOM_DATA_DIR: /var/lib/axiom
      DATABASE_URL: postgresql://axiom:axiom_password@postgres:5432/axiom_lineage
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: root
    depends_on:
      - postgres
      - openbao
    volumes:
      - ./config:/etc/axiom:ro
      - axiom-state:/var/lib/axiom
    ports:
      - "127.0.0.1:8787:8787"
    expose:
      - "9001"
    restart: unless-stopped

  mcp-backend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../..:/app:ro
    command: ["node", "gateway/mcp-interceptor/mock_mcp_http_server.cjs"]
    expose:
      - "8000"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: axiom-postgres
    environment:
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: axiom_password
      POSTGRES_DB: axiom_lineage
    ports:
      - "5432:5432"
    volumes:
      - ../../lineage-graph/migrations/0001_phase2_graph.sql:/docker-entrypoint-initdb.d/0001_phase2_graph.sql:ro
      - ../../lineage-graph/migrations/0002_tenant_rls.sql:/docker-entrypoint-initdb.d/0002_tenant_rls.sql:ro
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  openbao:
    image: openbao/openbao:latest
    container_name: axiom-openbao
    environment:
      BAO_DEV_ROOT_TOKEN_ID: root
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    restart: unless-stopped

volumes:
  axiom-state:
  postgres-data:
