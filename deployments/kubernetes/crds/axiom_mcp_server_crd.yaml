apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: axiommcpservers.nhi.axiom.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: nhi.axiom.io
  names:
    kind: AxiomMcpServer
    listKind: AxiomMcpServerList
    plural: axiommcpservers
    singular: axiommcpserver
    shortNames:
      - axmmcp
      - axmtarget
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - canonicalResourceUri
                - pinnedSchemaSha256
              properties:
                canonicalResourceUri:
                  type: string
                  description: "Canonical RFC 8707 audience identifier (e.g., mcp://postgres-prod.internal)"
                upstreamAddress:
                  type: string
                  description: "Target gRPC or JSON-RPC upstream host:port (e.g., postgres-adapter.prod.svc:9090)"
                pinnedSchemaSha256:
                  type: string
                  description: "Deterministic SHA-256 hash of the canonical RFC 8785 JSON tool definitions"
                validationProfile:
                  type: object
                  properties:
                    sqlDialect:
                      type: string
                      enum: ["generic", "postgresql", "mysql", "mssql"]
                      default: "generic"
                    allowedSqlFunctions:
                      type: array
                      items:
                        type: string
                    confinedPaths:
                      type: array
                      items:
                        type: object
                        required:
                          - argumentName
                          - rootPath
                        properties:
                          argumentName:
                            type: string
                          rootPath:
                            type: string
                    allowedEgressHosts:
                      type: array
                      items:
                        type: string
                secretlessBroker:
                  type: object
                  properties:
                    provider:
                      type: string
                      enum: ["openbao", "aws_sts", "gcp_sts", "azure_entra", "oauth2_client_credentials", "api_key_vault_injector"]
                      default: "openbao"
                    vaultPath:
                      type: string
                    roleArn:
                      type: string
                    defaultTtlSeconds:
                      type: integer
                      default: 300
            status:
              type: object
              properties:
                registered:
                  type: boolean
                lastHeartbeat:
                  type: string
                  format: date-time
                activeToolCount:
                  type: integer
                schemaDriftDetected:
                  type: boolean
