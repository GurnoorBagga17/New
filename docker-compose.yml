# Axiom NHI - Local Development Services
# Provides PostgreSQL, Redis, and OpenBao for local development

version: '3.9'

services:
  # PostgreSQL - Primary database
  postgres:
    image: postgres:16-alpine
    container_name: axiom-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axiom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable must be set}
      POSTGRES_DB: ${POSTGRES_DB:-axiom_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - axiom-network

  # Redis - Caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: axiom-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - axiom-network

  # OpenBao - Secrets management (optional)
  openbao:
    image: openbao/openbao:latest
    container_name: axiom-openbao
    cap_add:
      - IPC_LOCK
    environment:
      OPENBAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_ROOT_TOKEN_ID:?OPENBAO_DEV_ROOT_TOKEN_ID must be set}
      OPENBAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "openbao", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - axiom-network

  # PostgreSQL Admin UI (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: axiom-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@axiom.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD must be set}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - axiom-network
    profiles:
      - tools

  # Redis Commander (optional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: axiom-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - axiom-network
    profiles:
      - tools

  # Mailhog - Email testing (optional)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: axiom-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - axiom-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  axiom-network:
    driver: bridge

# Usage:
#
# Start core services:
#   docker compose up -d
#
# Start with optional tools:
#   docker compose --profile tools up -d
#
# View logs:
#   docker compose logs -f
#
# Stop services:
#   docker compose down
#
# Reset all data:
#   docker compose down -v
#
# Access services:
#   PostgreSQL:       localhost:5432
#   Redis:            localhost:6379
#   OpenBao:          http://localhost:8200
#   PgAdmin:          http://localhost:5050 (admin@axiom.local / admin)
#   Redis Commander:  http://localhost:8081
#   Mailhog:          http://localhost:8025
