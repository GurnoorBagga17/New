[package]
name = "extmcp-cedar"
version = "0.1.0"
edition = "2021"

[dependencies]
cedar-policy = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
arc-swap = "1"
thiserror = "1"
tracing = "0.1"
async-trait = "0.1"
extmcp-authorization = { path = "../authorization" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
