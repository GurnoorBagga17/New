[package]
name = "extmcp-runtime"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
extmcp-authorization = { path = "../authorization" }
prost = "0.13"
prost-types = "0.13"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tonic = { version = "0.12", features = ["transport"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
