[package]
name = "extmcp-runtime"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
axiom-identity = { path = "../../../identity" }
axiom-validators = { path = "../../../validators" }
axiom-audit = { path = "../../../observability/audit" }
axiom-kill-switch = { path = "../../../observability/kill-switch" }
axiom-lineage-graph = { path = "../../../lineage-graph" }
axiom-secretless = { path = "../../../secretless" }
axiom-risk-engine = { path = "../../../risk-engine" }
chrono = "0.4"
extmcp-authorization = { path = "../authorization" }
extmcp-cedar = { path = "../cedar" }
extmcp-policy-api = { path = "../policy-api" }
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tonic = { version = "0.12", features = ["transport"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = "9.3"
base64 = "0.22"
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
uuid = { version = "1.10", features = ["v4"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
