[package]
name = "extmcp-authorization"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
arc-swap = "1"
async-trait = "0.1"
axiom-identity = { path = "../../../identity" }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
